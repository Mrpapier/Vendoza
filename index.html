<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="VENDOZA — gestion simple et professionnelle de votre commerce.">
<link rel="manifest" href="manifest.webmanifest">
<title>VENDOZA — Gestion commerciale</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#778198;--line:#e7eaf0;--nav:#101827;--accent:#635bff;--accent2:#5148e5;--green:#15966b;--red:#d84b5b;--amber:#c78620;--shadow:0 8px 28px rgba(25,35,55,.07);--radius:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#8a84ff,#5148e5);display:grid;place-items:center;font-weight:900;font-size:19px}.brand strong{font-size:20px;letter-spacing:1px}.brand small{display:block;color:#aeb8ca;font-size:11px;letter-spacing:1.5px}.nav-label{font-size:10px;color:#8290a8;font-weight:800;letter-spacing:1.5px;padding:0 12px;margin-bottom:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b9c2d2;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:#242f43;color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:auto;color:#8e9ab0;font-size:12px;padding:12px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:12px}.topbar h1{font-size:18px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.avatar{width:39px;height:39px;border-radius:50%;background:#eeedff;color:var(--accent);display:grid;place-items:center;font-weight:800}.content{padding:30px 34px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.page-head h2{font-size:25px;margin:0 0 5px}.page-head p{color:var(--muted);margin:0}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:white;font-weight:700;box-shadow:0 5px 12px #635bff25}.btn:hover{background:var(--accent2)}.btn.secondary{background:#f0efff;color:var(--accent);box-shadow:none}.btn.ghost{background:#fff;color:#49536a;border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff0f1;color:var(--red);box-shadow:none}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:600}.stat-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f0efff;color:var(--accent);font-size:18px}.stat-value{font-size:27px;font-weight:800;margin:13px 0 3px;letter-spacing:-.8px}.stat-note{font-size:12px;color:var(--muted)}.two-col{grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-title h3{margin:0;font-size:16px}.section-title span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8a93a5;font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #f0f1f5;font-size:13px}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#f0efff;color:var(--accent)}.pill.green{background:#e7f7f0;color:var(--green)}.pill.amber{background:#fff5e4;color:var(--amber)}.pill.red{background:#fff0f1;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:30px 10px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:15px;text-align:left;color:var(--ink);font-weight:700}.quick button span{display:block;font-size:20px;margin-bottom:7px}.quick button small{color:var(--muted);font-weight:400}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{min-width:220px;flex:1}.field{width:100%;padding:11px 12px;border:1px solid #dfe3eb;border-radius:10px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #635bff18}.modal-back{position:fixed;inset:0;background:#10182788;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-back.open{display:flex}.modal{background:#fff;border-radius:18px;padding:23px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #10182755}.modal h3{margin:0 0 18px;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-field{display:grid;gap:6px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;color:#68738a;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{background:#fff8e8;border:1px solid #f4e2b7;color:#805c1b;padding:13px 15px;border-radius:12px;font-size:12px;margin-bottom:18px}.hidden{display:none!important}.mobile-menu{display:none;border:0;background:#f1f2f7;border-radius:9px;padding:9px}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:10px 4px 0}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:min(34px,70%);background:linear-gradient(180deg,#8b85ff,#625bfa);border-radius:7px 7px 3px 3px;min-height:4px}.bar-col small{font-size:10px;color:var(--muted)}.bar-col b{font-size:10px;color:#5d6679}.settings-grid{grid-template-columns:repeat(2,1fr)}.muted{color:var(--muted)}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;color:#586278}.footer-note{color:#9aa2b1;font-size:11px;text-align:center;margin:28px 0 8px}
@media(max-width:1000px){.app{grid-template-columns:220px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:24px}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:.22s;box-shadow:15px 0 45px #0003}.sidebar.open{transform:translateX(0)}.topbar{height:66px;padding:0 16px}.mobile-menu{display:block}.content{padding:20px 15px}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:22px}.stats{gap:10px}.card{padding:15px}.stat-value{font-size:22px}.two-col{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.quick{gap:8px}.quick button{padding:12px}.topbar p{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">V</div><div><strong>VENDOZA</strong><small>GESTION COMMERCIALE</small></div></div>
  <div><div class="nav-label">MENU PRINCIPAL</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Vue d'ensemble</button>
    <button data-page="orders"><span class="ico">▤</span>Commandes</button>
    <button data-page="products"><span class="ico">▣</span>Produits & stocks</button>
    <button data-page="customers"><span class="ico">♙</span>Clients</button>
    <button data-page="sales"><span class="ico">◈</span>Ventes</button>
    <button data-page="invoices"><span class="ico">▧</span>Factures & reçus</button>
    <button data-page="reports"><span class="ico">▥</span>Statistiques</button>
  </nav></div>
  <div><div class="nav-label">CONFIGURATION</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Paramètres</button></nav></div>
  <div class="side-foot">VENDOZA V1.0<br>Votre commerce, mieux organisé.</div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="mobile-menu" id="menuBtn">☰</button><div><h1 id="topTitle">Vue d'ensemble</h1><p id="today"></p></div></div><div class="avatar" id="avatar">VC</div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><h3 id="modalTitle">Ajouter</h3><form id="modalForm"><div class="form-grid" id="modalFields"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' F CFA', today=new Date();
const initial={shop:'Mon commerce',owner:'Gestionnaire',products:[{id:1,name:'Eau minérale',sku:'EAU-001',price:500,stock:40,alert:10},{id:2,name:'Riz 5 kg',sku:'RIZ-005',price:3500,stock:18,alert:5},{id:3,name:'Huile 1 L',sku:'HUI-001',price:1200,stock:7,alert:10}],customers:[{id:1,name:'Client comptoir',phone:'',email:''}],orders:[],sales:[],invoices:[]};
let db;try{db=JSON.parse(localStorage.getItem('vendoza_db'))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
let page='dashboard', editId=null, modalType=null;
function save(){localStorage.setItem('vendoza_db',JSON.stringify(db))}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sumSales(){return db.sales.reduce((a,x)=>a+Number(x.total||0),0)}
function statusPill(s){let c=s==='Livrée'||s==='Payée'?'green':s==='Annulée'?'red':'amber';return `<span class="pill ${c}">${esc(s)}</span>`}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function table(headers,rows,empty){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function render(){
$('#topTitle').textContent=({dashboard:'Vue d’ensemble',orders:'Commandes',products:'Produits & stocks',customers:'Clients',sales:'Ventes',invoices:'Factures & reçus',reports:'Statistiques',settings:'Paramètres'})[page];
const c=$('#content');
if(page==='dashboard'){
let pending=db.orders.filter(x=>x.status!=='Livrée'&&x.status!=='Annulée').length, low=db.products.filter(x=>x.stock<=x.alert).length;
let rows=db.orders.slice(-5).reverse().map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td>${statusPill(o.status)}</td><td>${esc(o.date)}</td></tr>`).join('');
c.innerHTML=pageHead('Bonjour 👋',`Voici la situation de ${esc(db.shop)} aujourd’hui.`)+
`<div class="grid stats"><div class="card"><div class="stat-top">Chiffre d’affaires <span class="stat-icon">↗</span></div><div class="stat-value">${money(sumSales())}</div><div class="stat-note">Total des ventes enregistrées</div></div><div class="card"><div class="stat-top">Commandes <span class="stat-icon">▤</span></div><div class="stat-value">${db.orders.length}</div><div class="stat-note">${pending} en cours</div></div><div class="card"><div class="stat-top">Produits <span class="stat-icon">▣</span></div><div class="stat-value">${db.products.length}</div><div class="stat-note">${low} stock(s) à surveiller</div></div><div class="card"><div class="stat-top">Clients <span class="stat-icon">♙</span></div><div class="stat-value">${db.customers.length}</div><div class="stat-note">Clients enregistrés</div></div></div>
<div class="grid two-col"><div class="card"><div class="section-title"><h3>Commandes récentes</h3><button class="btn secondary" onclick="setPage('orders')">Voir tout</button></div>${table(['Référence','Client','Montant','Statut','Date'],rows,'Aucune commande pour le moment.')}</div><div class="card"><div class="section-title"><h3>Actions rapides</h3><span>Accès direct</span></div><div class="quick"><button onclick="openModal('order')"><span>＋</span>Nouvelle commande<small>Enregistrer une commande</small></button><button onclick="openModal('product')"><span>▣</span>Ajouter produit<small>Mettre à jour le catalogue</small></button><button onclick="openModal('customer')"><span>♙</span>Nouveau client<small>Créer une fiche client</small></button><button onclick="setPage('reports')"><span>▥</span>Voir les rapports<small>Suivre les performances</small></button></div><div style="margin-top:18px"><div class="section-title"><h3>Alertes de stock</h3><span>${low} alerte(s)</span></div>${low?db.products.filter(x=>x.stock<=x.alert).map(p=>`<p style="font-size:12px;margin:9px 0">${esc(p.name)} <b style="float:right;color:var(--red)">${p.stock} restant(s)</b></p>`).join(''):'<p class="muted" style="font-size:12px">Aucune alerte de stock.</p>'}</div></div></div>`;
}
if(page==='products'){
let rows=db.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.sku)}</small></td><td>${money(p.price)}</td><td>${p.stock<=p.alert?`<b style="color:var(--red)">${p.stock}</b>`:p.stock}</td><td>${p.stock<=p.alert?'<span class="pill red">Stock faible</span>':'<span class="pill green">Disponible</span>'}</td><td><div class="row-actions"><button class="icon-btn" onclick="editItem('product',${p.id})">Modifier</button><button class="icon-btn" onclick="delItem('products',${p.id})">Supprimer</button></div></td></tr>`).join('');
c.innerHTML=pageHead('Produits & stocks','Gérez votre catalogue, vos prix et vos quantités.',`<button class="btn" onclick="openModal('product')">＋ Ajouter un produit</button>`)+`<div class="card"><div class="toolbar"><input class="field search" id="filter" placeholder="Rechercher un produit…"></div><div id="productTable">${table(['Produit','Prix de vente','Stock','État','Actions'],rows,'Aucun produit enregistré.')}</div></div>`;
$('#filter').oninput=e=>{let q=e.target.value.toLowerCase();$('#productTable').innerHTML=table(['Produit','Prix de vente','Stock','État','Actions'],db.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q)).map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.sku)}</small></td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.stock<=p.alert?'<span class="pill red">Stock faible</span>':'<span class="pill green">Disponible</span>'}</td><td><button class="icon-btn" onclick="editItem('product',${p.id})">Modifier</button> <button class="icon-btn" onclick="delItem('products',${p.id})">Supprimer</button></td></tr>`).join(''),'Aucun résultat.')};
}
if(page==='customers'){
let rows=db.customers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td><button class="icon-btn" onclick="editItem('customer',${x.id})">Modifier</button> <button class="icon-btn" onclick="delItem('customers',${x.id})">Supprimer</button></td></tr>`).join('');
c.innerHTML=pageHead('Clients','Retrouvez les coordonnées de vos clients.',`<button class="btn" onclick="openModal('customer')">＋ Ajouter un client</button>`)+`<div class="card">${table(['Nom','Téléphone','E-mail','Actions'],rows,'Aucun client enregistré.')}</div>`;
}
if(page==='orders'){
let rows=db.orders.slice().reverse().map(o=>`<tr><td><b>#${o.id}</b></td><td>${esc(o.customer)}</td><td>${esc(o.item)}</td><td>${o.qty}</td><td>${money(o.total)}</td><td>${statusPill(o.status)}</td><td><select class="field" style="min-width:125px;padding:7px" onchange="changeStatus(${o.id},this.value)">${['En attente','En préparation','En livraison','Livrée','Annulée'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
c.innerHTML=pageHead('Commandes','Suivez chaque commande de sa création à sa livraison.',`<button class="btn" onclick="openModal('order')">＋ Nouvelle commande</button>`)+`<div class="card">${table(['Référence','Client','Article','Qté','Total','Statut','Mettre à jour'],rows,'Aucune commande enregistrée.')}</div>`;
}
if(page==='sales'){
let rows=db.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(s.label)}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td></tr>`).join('');
c.innerHTML=pageHead('Ventes','Historique des ventes effectivement enregistrées.',`<button class="btn" onclick="openModal('sale')">＋ Enregistrer une vente</button>`)+`<div class="card"><div class="section-title"><h3>Total enregistré</h3><b>${money(sumSales())}</b></div>${table(['Date','Client','Détail','Montant','Paiement'],rows,'Aucune vente enregistrée.')}</div>`;
}
if(page==='invoices'){
let rows=db.invoices.slice().reverse().map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(i.customer)}</td><td>${money(i.total)}</td><td>${esc(i.date)}</td><td><button class="icon-btn" onclick="printInvoice(${i.id})">Imprimer</button></td></tr>`).join('');
c.innerHTML=pageHead('Factures & reçus','Consultez et imprimez les justificatifs créés.',`<button class="btn" onclick="openModal('invoice')">＋ Créer une facture</button>`)+`<div class="card">${table(['N° facture','Client','Montant','Date','Action'],rows,'Aucune facture créée.')}</div>`;
}
if(page==='reports'){
let months=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'], now=new Date(), vals=months.map((m,i)=>db.sales.filter(s=>{let d=new Date(s.iso||s.date);return d.getMonth()===i&&d.getFullYear()===now.getFullYear()}).reduce((a,s)=>a+Number(s.total),0)), max=Math.max(1,...vals);
c.innerHTML=pageHead('Statistiques','Une vue simple des performances de votre commerce.')+`<div class="grid stats"><div class="card"><div class="stat-top">Chiffre d’affaires</div><div class="stat-value">${money(sumSales())}</div></div><div class="card"><div class="stat-top">Nombre de ventes</div><div class="stat-value">${db.sales.length}</div></div><div class="card"><div class="stat-top">Panier moyen</div><div class="stat-value">${money(db.sales.length?sumSales()/db.sales.length:0)}</div></div><div class="card"><div class="stat-top">Commandes livrées</div><div class="stat-value">${db.orders.filter(o=>o.status==='Livrée').length}</div></div></div><div class="card"><div class="section-title"><h3>Ventes par mois — ${now.getFullYear()}</h3><span>Sur la base des ventes enregistrées</span></div><div class="chart">${vals.map((v,i)=>`<div class="bar-col"><b>${v?Math.round(v/1000)+'k':''}</b><div class="bar" style="height:${Math.max(3,v/max*75)}%"></div><small>${months[i]}</small></div>`).join('')}</div></div>`;
}
if(page==='settings'){
c.innerHTML=pageHead('Paramètres','Personnalisez les informations de votre espace.')+`<div class="grid settings-grid"><div class="card"><h3>Informations du commerce</h3><div class="form-field" style="margin:14px 0"><label>Nom du commerce</label><input class="field" id="shopName" value="${esc(db.shop)}"></div><div class="form-field"><label>Nom du gestionnaire</label><input class="field" id="ownerName" value="${esc(db.owner)}"></div><button class="btn" style="margin-top:15px" onclick="saveSettings()">Enregistrer</button></div><div class="card"><h3>Données & sauvegarde</h3><p class="muted" style="font-size:13px">Vos données V1 sont enregistrées dans le navigateur de cet appareil.</p><button class="btn secondary" onclick="exportData()">Exporter mes données (JSON)</button><p style="margin-top:16px"><label class="btn ghost" for="importFile">Importer une sauvegarde</label><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)"></p><button class="btn danger" onclick="resetData()">Réinitialiser les données de démonstration</button></div><div class="card" style="grid-column:1/-1"><h3>À propos de VENDOZA</h3><p class="muted">Version 1.0 — interface de gestion commerciale.</p><div class="notice">Important : cette version est une base fonctionnelle locale. Les comptes utilisateurs, la synchronisation cloud multi-commerces et les paiements Orange Money / Moov Money nécessitent la connexion d'un backend sécurisé (Supabase) et les accès officiels des opérateurs. Aucun paiement réel n'est déclenché ici.</div></div></div>`;
}
c.insertAdjacentHTML('beforeend','<div class="footer-note">VENDOZA • Organisez votre commerce avec clarté.</div>');
}
function openModal(type,item=null){modalType=type;editId=item?.id??null;let fields=[],title='';
const f=(name,label,kind='text',value='',opts=null,full=false)=>fields.push({name,label,kind,value,opts,full});
if(type==='product'){title=editId?'Modifier le produit':'Ajouter un produit';f('name','Nom du produit','text',item?.name||'');f('sku','Référence / SKU','text',item?.sku||'');f('price','Prix de vente (F CFA)','number',item?.price??0);f('stock','Quantité en stock','number',item?.stock??0);f('alert','Seuil d’alerte','number',item?.alert??5)}
if(type==='customer'){title=editId?'Modifier le client':'Ajouter un client';f('name','Nom du client','text',item?.name||'');f('phone','Téléphone','tel',item?.phone||'');f('email','E-mail','email',item?.email||'')}
if(type==='order'||type==='sale'){title=type==='order'?'Nouvelle commande':'Enregistrer une vente';f('customer','Nom du client','text','Client comptoir');f('item','Produit / détail','text','');f('qty','Quantité','number',1);f('unit','Prix unitaire (F CFA)','number',0);if(type==='order')f('status','Statut','select','En attente',['En attente','En préparation','En livraison','Livrée']);else f('payment','Mode de paiement','select','Espèces',['Espèces','Orange Money','Moov Money','Virement','Autre'])}
if(type==='invoice'){title='Créer une facture';f('customer','Nom du client','text','');f('label','Détail de la prestation / vente','text','',null,true);f('total','Montant (F CFA)','number',0)}
$('#modalTitle').textContent=title;$('#modalFields').innerHTML=fields.map(x=>`<div class="form-field ${x.full?'full':''}"><label>${x.label}</label>${x.kind==='select'?`<select class="field" name="${x.name}">${x.opts.map(o=>`<option ${o===x.value?'selected':''}>${o}</option>`).join('')}</select>`:`<input class="field" name="${x.name}" type="${x.kind}" value="${esc(x.value)}" ${x.kind==='number'?'min="0" step="1"':''} required>`}</div>`).join('');
$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open')}
$('#cancelModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
$('#modalForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());for(let k in data)if(['price','stock','alert','qty','unit','total'].includes(k))data[k]=Number(data[k]);let date=new Date().toLocaleDateString('fr-FR');
if(modalType==='product'){if(editId)Object.assign(db.products.find(x=>x.id===editId),data);else db.products.push({id:id(),...data})}
if(modalType==='customer'){if(editId)Object.assign(db.customers.find(x=>x.id===editId),data);else db.customers.push({id:id(),...data})}
if(modalType==='order'||modalType==='sale'){let total=data.qty*data.unit;if(modalType==='order'){let p=db.products.find(x=>x.name.toLowerCase()===data.item.toLowerCase());if(p&&p.stock>=data.qty)p.stock-=data.qty;db.orders.push({id:id(),...data,total,date})}else{let p=db.products.find(x=>x.name.toLowerCase()===data.item.toLowerCase());if(p&&p.stock>=data.qty)p.stock-=data.qty;db.sales.push({id:id(),...data,total,date,iso:new Date().toISOString()})}}
if(modalType==='invoice')db.invoices.push({id:id(),number:'FAC-'+String(db.invoices.length+1).padStart(4,'0'),...data,date});
save();closeModal();render()};
function editItem(type,idv){let arr=type==='product'?db.products:db.customers;openModal(type,arr.find(x=>x.id===idv))}
function delItem(arr,idv){if(confirm('Confirmer la suppression ?')){db[arr]=db[arr].filter(x=>x.id!==idv);save();render()}}
function changeStatus(idv,s){let o=db.orders.find(x=>x.id===idv);if(o){o.status=s;if(s==='Livrée'&&!o.saleRecorded){db.sales.push({id:id(),customer:o.customer,label:o.item,qty:o.qty,total:o.total,payment:'À préciser',date:new Date().toLocaleDateString('fr-FR'),iso:new Date().toISOString()});o.saleRecorded=true}save();render()}}
function saveSettings(){db.shop=$('#shopName').value.trim()||'Mon commerce';db.owner=$('#ownerName').value.trim()||'Gestionnaire';save();$('#avatar').textContent=db.owner.slice(0,2).toUpperCase();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vendoza-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.orders||!x.customers)throw 0;db=x;save();render();alert('Sauvegarde importée.')}catch(err){alert('Fichier invalide.')}};r.readAsText(file)}
function resetData(){if(confirm('Effacer les données locales et revenir aux données de départ ?')){db=structuredClone(initial);save();render()}}
function printInvoice(idv){let x=db.invoices.find(i=>i.id===idv);let w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres pop-up pour imprimer.');return}w.document.write(`<html lang="fr"><meta charset="utf-8"><title>${x.number}</title><body style="font:16px Arial;padding:40px"><h1>VENDOZA — ${esc(db.shop)}</h1><h2>FACTURE ${esc(x.number)}</h2><p>Date : ${esc(x.date)}</p><p>Client : ${esc(x.customer)}</p><hr><p>${esc(x.label||'Vente')}</p><h2>Total : ${money(x.total)}</h2><p>Merci pour votre confiance.</p><script>window.print()<\/script></body></html>`);w.document.close()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#today').textContent=today.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#avatar').textContent=(db.owner||'VC').slice(0,2).toUpperCase();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
